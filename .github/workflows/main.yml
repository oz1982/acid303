name: Build NTS-1 unit

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make zip

      - name: Get logue SDK
        run: git clone --depth 1 --recursive https://github.com/korginc/logue-sdk.git sdk

      - name: Link toolchain where the SDK expects it
        run: |
          T=sdk/tools/gcc/gcc-arm-none-eabi-5_4-2016q3
          mkdir -p "$T"
          ln -s /usr/bin "$T/bin"
          ln -s /usr/lib/arm-none-eabi "$T/arm-none-eabi"

      - name: Prepare project
        run: |
          DEST=sdk/platform/nutekt-digital/acid303
          rm -rf "$DEST"
          cp -r sdk/platform/nutekt-digital/dummy-osc "$DEST"
          echo "--- ancien project.mk ---"
          cat "$DEST"/project.mk
          cp acid303/osc.cpp "$DEST"/osc.cpp
          cp acid303/manifest.json "$DEST"/manifest.json
          printf 'PROJECT := acid303\nPROJECT_TYPE := oscillator\n\nUCSRC =\nUCXXSRC = osc.cpp\nUINCDIR =\nUDEFS =\nULIB =\nULIBDIR =\n' > "$DEST"/project.mk
          echo "--- nouveau project.mk ---"
          cat "$DEST"/project.mk

      - name: Build
        run: make -C sdk/platform/nutekt-digital/acid303

      - name: Package unit
        run: |
          D=sdk/platform/nutekt-digital/acid303
          echo "--- objets compiles ---"
          ls -la "$D/build/obj"
          make -C "$D" install || echo "pas de cible install"
          mkdir -p out
          find sdk -name "*.ntkdigunit" -exec cp {} out/ \;
          if [ -z "$(ls out)" ]; then
            echo "Packaging manuel"
            mkdir -p pkg/acid303
            cp "$D/manifest.json" pkg/acid303/manifest.json
            cp "$D/build/acid303.bin" pkg/acid303/payload.bin
            (cd pkg/acid303 && zip -r9 ../../out/acid303.ntkdigunit manifest.json payload.bin)
          fi
          ls -la out

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acid303-build
          path: |
            out/
            sdk/platform/nutekt-digital/acid303/build/*.bin
            sdk/platform/nutekt-digital/acid303/build/*.map
          if-no-files-found: warn
