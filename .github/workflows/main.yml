name: Build NTS-1 unit

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi make zip

      - name: Get logue SDK
        run: git clone --depth 1 --recursive https://github.com/korginc/logue-sdk.git sdk

      - name: Link toolchain where the SDK expects it
        run: |
          T=sdk/tools/gcc/gcc-arm-none-eabi-5_4-2016q3
          mkdir -p "$T"
          ln -s /usr/bin "$T/bin"
          ln -s /usr/lib/arm-none-eabi "$T/arm-none-eabi"

      - name: Prepare project
        run: |
          DEST=sdk/platform/nutekt-digital/acid303
          rm -rf "$DEST"
          cp -r sdk/platform/nutekt-digital/dummy-osc "$DEST"
          cp acid303/osc.cpp "$DEST"/osc.cpp
          cp acid303/manifest.json "$DEST"/manifest.json
          sed -i 's/^PROJECT *[:?]*= .*/PROJECT := acid303/' "$DEST"/project.mk
          sed -i 's/^UCXXSRC *[:+]*= .*/UCXXSRC = osc.cpp/' "$DEST"/project.mk
          cat "$DEST"/project.mk

      - name: Build
        run: make -C sdk/platform/nutekt-digital/acid303

      - name: Collect unit
        run: |
          D=sdk/platform/nutekt-digital/acid303
          echo "--- contenu du dossier ---"
          ls -la "$D"
          echo "--- contenu de build ---"
          ls -laR "$D/build" | head -60
          mkdir -p out
          find sdk -name "*.ntkdigunit" -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acid303-build
          path: |
            out/
            sdk/platform/nutekt-digital/acid303/build/*.elf
            sdk/platform/nutekt-digital/acid303/build/*.bin
          if-no-files-found: warn
